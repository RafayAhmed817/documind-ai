services:
  api:
    build:
      context: ..
      dockerfile: test/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/code/data
      - hf_models:/models

  ui:
    build:
      context: ..
      dockerfile: test/Dockerfile
    command:
      - streamlit
      - run
      - frontend.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  chroma_data:
  hf_models: